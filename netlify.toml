[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "https://www.staug.in/*"
  to = "https://staug.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://staug.in/*"
  to = "https://staug.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.staug.in/*"
  to = "https://staug.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/staff/"
  to = "/staff"
  status = 301

[[redirects]]
  from = "/spatial/"
  to = "/spatial"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

[[redirects]]
  from = "/spatial"
  to = "/spatial.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
